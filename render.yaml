# Render Blueprint — Hệ thống quản lý CLB IP ĐHSP Huế
# 1 web service Node.js duy nhất. Database: TiDB Cloud (gói Starter miễn phí) —
# giao thức MySQL, port 4000, TLS bắt buộc. App tự tạo toàn bộ bảng lúc boot
# (database trống "test" cũng chạy được ngay), KHÔNG cần import SQL.
#
# Lúc Apply Blueprint điền tay 5 ô (sync: false — không commit vào repo):
#   DB_HOST                 → gateway01.<region>.prod.aws.tidbcloud.com (copy từ dialog Connect của TiDB Cloud)
#   DB_USER                 → <prefix>.root (copy từ dialog Connect)
#   DB_PASSWORD             → mật khẩu TiDB Cloud đã đặt khi tạo cluster
#   BOOTSTRAP_ADMIN_EMAIL   → email tài khoản admin đầu tiên
#   BOOTSTRAP_ADMIN_PASSWORD→ mật khẩu admin đầu tiên
# Tuỳ chọn: BOOTSTRAP_ADMINS → danh sách admin bổ sung "email1:matkhau1,email2:matkhau2,..."
#   (thêm sau khi apply qua tab Environment của service — server tự tạo tài khoản lúc boot)
# JWT_SECRET được Render tự sinh ngẫu nhiên (generateValue: true).

services:
  - type: web
    name: clbipdhsphue
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '4000'
      - key: DB_USER
        sync: false
      - key: DB_NAME
        value: 'test'
      - key: DB_SSL
        value: 'true'
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMINS
        sync: false
